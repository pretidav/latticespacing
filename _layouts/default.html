<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; }
    catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=VT323&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% seo title=false %}
  {% include math.html %}
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}<span class="cursor">_</span></a>
      <nav>
        <a href="{{ '/blog/' | relative_url }}">Thoughts</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme">light</button>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>Version 0.01</span>
      <span>&copy;{{ site.time | date: "%Y" }} {{ site.author }}</span>
      <span>Made with hate.</span>
      <a href="{{ '/feed.xml' | relative_url }}">[rss]</a>
    </footer>
  </div>
  <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById("theme-toggle");
      function label() { btn.textContent = root.dataset.theme === "dark" ? "light" : "dark"; }
      label();
      btn.addEventListener("click", function () {
        var next = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
    })();
  </script>
</body>
</html>
