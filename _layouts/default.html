<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=VT323&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% include math.html %}
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}<span class="cursor">_</span></a>
      <nav>
        <a href="{{ '/blog/' | relative_url }}">Thoughts</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://github.com/pretidav">GitHub</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>Version 0.01</span>
      <span>&copy;{{ site.time | date: "%Y" }} {{ site.author }}</span>
      <span>Made with love.</span>
    </footer>
  </div>
</body>
</html>
