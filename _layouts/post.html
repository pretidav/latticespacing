---
layout: default
---
<article>
  <p class="tag">[{{ page.category | default: "note" }}] · {{ page.date | date: "%b %-d, %Y" }}</p>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">&larr; all thoughts</a></p>
</article>
